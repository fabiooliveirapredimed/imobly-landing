<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cancelar subscrição — Imobly</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#FAF7F2;--copper:#C2894C;--copper-deep:#8B5E2A;
  --ink:#1C1A18;--slate:#6B6560;--border:#E8E1D8;
  --white:#FFFFFF;--dark:#141210;
  --corm:'Cormorant Garamond',serif;--mont:'Montserrat',sans-serif;
}
body{background:var(--cream);color:var(--ink);font-family:var(--mont);line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:60px 24px 100px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--slate);text-decoration:none;margin-bottom:32px;letter-spacing:.5px;text-transform:uppercase;font-weight:600}
.back:hover{color:var(--copper)}
h1{font-family:var(--corm);font-size:clamp(32px,5vw,44px);font-weight:400;margin-bottom:8px}
.updated{font-size:12px;color:var(--slate);margin-bottom:40px}
h2{font-family:var(--corm);font-size:20px;font-weight:600;margin:28px 0 8px}
p{font-size:14px;color:var(--slate);margin-bottom:4px}
.notice{background:#FFF8ED;border:1px solid #F0D9AE;border-radius:12px;padding:16px 18px;margin-bottom:32px;font-size:13px;color:#8B5E2A}
table{width:100%;border-collapse:collapse;margin:12px 0 20px;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-family:var(--mont);font-weight:600;color:var(--ink);font-size:12px;text-transform:uppercase;letter-spacing:.3px}
td{color:var(--slate)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.3px}
.tag-on{background:#E7F0E3;color:#3D6B33}
.tag-off{background:#F0D9AE;color:#8B5E2A}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="titulo">Cancelar subscrição</h1>
  <p id="msg" style="margin-top:12px;color:var(--slate)">A processar o seu pedido…</p>
  <p style="margin-top:32px"><a href="/" class="back">← imobly.pt</a></p>
</div>
<script>
(function(){
  var estado = new URLSearchParams(location.search).get('estado');
  var t = document.getElementById('titulo'), m = document.getElementById('msg');
  if (estado === 'ok') {
    t.textContent = 'Subscrição cancelada';
    m.textContent = 'Já não vai receber emails de marketing deste remetente. Se mudar de ideias, pode contactá-lo diretamente.';
  } else {
    t.textContent = 'Link inválido';
    m.textContent = 'Não foi possível encontrar este pedido de cancelamento. O link pode já ter sido usado. Se continuar a receber emails, escreva-nos para info@imobly.pt.';
  }
})();
</script>
</body>
</html>
